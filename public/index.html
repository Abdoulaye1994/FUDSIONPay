<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>MoneyFusion Payment</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Online Payment 💳</h1>
    <form id="paymentForm">
      <label>Full Name:</label>
      <input type="text" id="nomclient" placeholder="John Doe" required>

      <label>Phone Number:</label>
      <input type="text" id="numeroSend" placeholder="+40 123 456 789" required>

      <label>Email:</label>
      <input type="email" id="email" placeholder="example@gmail.com" required>

      <label>Currency:</label>
      <select id="currency">
        <option value="EUR">EUR</option>
        <option value="USD">USD</option>
        <option value="RON">RON</option>
      </select>

      <label>Amount:</label>
      <input type="number" id="amount" value="10" required>

      <button type="submit">Pay Now</button>
    </form>

    <div id="message"></div>
  </div>

  <script>
    const form = document.getElementById("paymentForm");
    const message = document.getElementById("message");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      const data = {
        nomclient: document.getElementById("nomclient").value.trim(),
        numeroSend: document.getElementById("numeroSend").value.trim(),
        email: document.getElementById("email").value.trim(),
        amount: parseFloat(document.getElementById("amount").value),
        currency: document.getElementById("currency").value
      };

      try {
        const response = await fetch("/create-payment", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(data)
        });

        const result = await response.json();

        if (result.statut && result.url) {
          message.innerHTML = "Redirecting to payment...";
          window.location.href = result.url;
        } else {
          message.innerHTML = "❌ Payment creation error";
          console.log(result);
        }
      } catch (err) {
        console.error("Error:", err);
        message.innerHTML = "⚠️ Cannot initiate payment";
      }
    });
  </script>
</body>
</html>
